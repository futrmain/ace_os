worker_processes  auto;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include /nginx_conf/CIS_guidelines.conf;

    log_format  main  '$remote_addr - $remote_user [$time_local] - $host - "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    # modern configuration
    # https://ssl-config.mozilla.org/
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;


    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin";
    #add_header Strict-Transport-Security "max-age=10" always;
    #add_header Content-Security-Policy "default-src 'self' www.google-analytics.com ajax.googleapis.com www.google.com google.com gstatic.com www.gstatic.com connect.facebook.n>

    server {
        listen 8010 ;
        listen [::]:8010 ;
        server_name  localhost;

        location / {
            limit_except GET {
                deny all;
            }
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # Demo preload payloads, bind-mounted read-only to /payloads (see
        # compose.yaml). Served as static JSON for the UI's guided chat preload.
        location = /incident.json      { root /payloads; }
        location = /late-evidence.json { root /payloads; }

        # OpenAI-compatible LLM API, proxied to the internal llama.cpp container.
        # POST is required here, so no limit_except GET. Long timeouts because
        # token generation on CPU is slow.
        #
        # llama is a PARKED, profile-gated service (see compose.yaml), so it is
        # normally absent. A bare `proxy_pass http://llama:8080/` makes nginx
        # resolve `llama` at STARTUP and abort ("host not found in upstream") when
        # it is missing. Instead resolve lazily via Docker's embedded DNS: put the
        # host in a variable + `resolver`, and rewrite off the /llm/ prefix (a
        # variable proxy_pass forwards $uri, so the trailing-slash strip is done
        # by the rewrite). nginx now starts without llama; /llm/ just 502s until
        # you bring llama up with `docker compose --profile local-llm up`.
        location /llm/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $llama_host llama;
            rewrite ^/llm/(.*)$ /$1 break;
            proxy_pass http://$llama_host:8080;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # MobKit console/admin app, proxied to the internal mobkit container.
        # proxy_pass has no URI part, so the full path (incl. the /console
        # prefix the SPA expects) is forwarded unchanged. POST is needed for
        # /console/rpc, so no limit_except. NOTE: this is an ADMIN surface that
        # can drive the mob -- it is UNAUTHENTICATED here (require_app_auth=false
        # in mobkit-host). Do not leave it open on the public internet.
        location /console {
            proxy_pass http://mobkit:8090;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE at /console/timeline/stream: keep the connection open and
            # unbuffered so events stream through in real time.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Blob/image retrieval for the console (absolute /blobs/ paths).
        location /blobs/ {
            proxy_pass http://mobkit:8090;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public health check exposed by the mobkit runtime.
        location = /healthz {
            proxy_pass http://mobkit:8090;
        }

        include /nginx_conf/acme_errors.conf;
    }
}
