worker_processes  auto;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include /nginx_conf/CIS_guidelines.conf;

    log_format  main  '$remote_addr - $remote_user [$time_local] - $host - "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;

    # modern configuration
    # https://ssl-config.mozilla.org/
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;


    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin";
    #add_header Strict-Transport-Security "max-age=10" always;
    #add_header Content-Security-Policy "default-src 'self' www.google-analytics.com ajax.googleapis.com www.google.com google.com gstatic.com www.gstatic.com connect.facebook.n>

    server {
        listen 8010 ;
        listen [::]:8010 ;
        server_name  futrmain.com;

        location / {
            limit_except GET {
                deny all;
            }
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }


        include /nginx_conf/acme_errors.conf;
    }
}
